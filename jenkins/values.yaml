  # --- All builds run on agents; the controller only coordinates ---------
  numExecutors: 0

  # --- Resources --------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  # --- Probes (spec bonus) ---------------------------------------------
  probes:
    startupProbe:
      httpGet:
        path: '/login'
        port: http
      periodSeconds: 10
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: '/login'
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: '/login'
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  # --- Security context --------------------------------------------------
  # Jenkins needs a writable JENKINS_HOME, so the root filesystem cannot be
  # read-only; everything else is locked down.
  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  # --- Exposure ---------------------------------------------------------
  # HTTPS and the IP restriction are added at install time by
  # configure-jenkins.sh: the certificate ARN and your public IP are both
  # environment-specific and must not be committed.
  serviceType: ClusterIP
  ingress:
    enabled: true
    ingressClassName: alb
    path: /
    # MUST be Prefix. The default (ImplementationSpecific) lets the ALB
    # controller decide, and it treats "/" as an EXACT match — so the root URL
    # works but /login, /job/... and every static asset return a bare 404 from
    # the ALB before ever reaching Jenkins.
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /login
      # Overwritten at install time. If these placeholders ever reach a
      # running cluster, verify-jenkins.sh fails.
      alb.ingress.kubernetes.io/inbound-cidrs: "REPLACE_AT_INSTALL"

  # --- Scheduling: the tainted Jenkins node only ------------------------
  tolerations:
    - key: "role"
      operator: "Equal"
      value: "jenkins"
      effect: "NoSchedule"
  # nodeSelector injected at install time (the node group name contains the
  # cluster name). The label EKS actually sets is `eks.amazonaws.com/nodegroup`
  # — there is no `-name` suffix.

  # --- JCasC: only what the chart does NOT already model -----------------
  # NOT set here, because the chart owns them and duplicating causes
  # ConfiguratorConflictException:
  #   jenkins.numExecutors          -> controller.numExecutors (above)
  #   jenkins.securityRealm         -> chart default (local, signup disabled)
  #   jenkins.authorizationStrategy -> chart default
  #   jenkins.clouds (kubernetes)   -> chart builds this from agent.* values
  JCasC:
    defaultConfig: true
    configScripts:
      welcome: |
        jenkins:
          systemMessage: >
            VM Order Portal — CI/CD and observability.
            Configured entirely by JCasC; no manual UI setup.
            application-ci builds and scans. application-cd deploys and
            verifies against Prometheus before the release is kept.
      prometheus: |
        # Phase 5 — the Prometheus plugin's endpoint.
        #
        # It publishes controller/JVM health, queue length and wait time,
        # executor counts, dynamic agent counts and per-job build results and
        # durations. That is the "is the delivery system healthy" third of the
        # task sheet, and none of it is visible from Kubernetes metrics: a
        # Jenkins pod can be perfectly Ready while the build queue is stuck.
        #
        # NOT SET HERE: collectNodeStatus. The Configuration as Code plugin
        # cannot set that attribute (jenkinsci/prometheus-plugin#525) and the
        # controller refuses to START with a configurator exception if you try.
        # Node status is available from kube-state-metrics anyway.
        unclassified:
          prometheusConfiguration:
            path: "prometheus"
            defaultNamespace: "jenkins"
            # 30s, matching the scrape interval. The plugin computes its
            # metrics on a timer rather than on request, so a collection period
            # LONGER than the scrape interval means Prometheus repeatedly
            # records the same stale numbers and every rate() over them is
            # flat zero - which reads as "nothing is happening" rather than as
            # "nothing is being measured".
            collectingMetricsPeriodInSeconds: 30
            # false = the endpoint is readable without a Jenkins login.
            #
            # This is the open decision in docs/PHASE5_PLAN.md §11, and it is
            # set to the SIMPLE option deliberately rather than by accident.
            # What bounds it: jenkins/networkpolicy.yaml admits port 8080 only
            # from the observability namespace and from the ALB, and the ALB is
            # restricted to the operator's IP. Anyone who can already reach the
            # Jenkins login page can also read this.
            #
            # To close that gap, set this true and give the ServiceMonitor in
            # helm/observability an `authorization` block pointing at a Secret
            # holding a Jenkins API token. That costs a token to create, store
            # and rotate, which is why it is a decision and not a default.
            useAuthenticatedEndpoint: false
            countSuccessfulBuilds: true
            countUnstableBuilds: true
            countFailedBuilds: true
            countNotBuiltBuilds: true
            countAbortedBuilds: true
            fetchTestResults: true
            # Disk usage collection walks the whole JENKINS_HOME on a timer.
            # On an 8Gi EBS volume shared with build workspaces that is real IO
            # for a number nobody alerts on.
            collectDiskUsage: false

# --- Persistence: JENKINS_HOME on an EBS volume ---------------------------
persistence:
  enabled: true
  size: 8Gi
  storageClass: gp2

# --- Controller ServiceAccount --------------------------------------------
serviceAccount:
  create: false          # created by jenkins/rbac.yaml, with its RoleBinding
  name: jenkins

# --- Agents ----------------------------------------------------------------
# The chart builds the Kubernetes cloud from this section. Each pipeline
# supplies its own podTemplate (with its own ServiceAccount), so only defaults
# live here.
agent:
  enabled: true
  namespace: "jenkins"
  # Agents must tolerate the Jenkins node taint even when a pipeline forgets.
  tolerations:
    - key: "role"
      operator: "Equal"
      value: "jenkins"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
