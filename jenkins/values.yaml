# jenkins/values.yaml — Jenkins Configuration as Code (static part)
#
# Everything Jenkins needs to come up fully configured: plugins, system
# settings, security context, storage. Nothing is ever clicked in the UI —
# destroy the cluster, rebuild it, and Jenkins returns identically.
#
# Environment-specific values (account ID, cluster name, your IP, certificate
# ARN, repo URL) are NOT here. They are generated at install time by
# scripts/configure-jenkins.sh from Terraform outputs, so this file is safe to
# commit and a second contributor needs no edits.
#
# IMPORTANT LESSON ENCODED HERE:
# The chart generates its OWN JCasC config from controller.* values. If a
# custom configScript sets a key the chart already sets, JCasC merges both,
# finds a conflict, and refuses to start with ConfiguratorConflictException.
# So: prefer the chart's native values; use configScripts only for what the
# chart does not model.

controller:
  # --- Pinned image, never :latest (spec requirement) -------------------
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.568.1-lts-jdk21"
    pullPolicy: IfNotPresent

  # --- Plugins ----------------------------------------------------------
  # PINNED, and pinned COMPLETELY. Two settings matter here, and the versions
  # below are the less important of the two.
  #
  # installLatestPlugins defaults to TRUE in this chart -- "download the
  # minimum required version or latest version of all dependencies". With it
  # on, pinning the plugins we chose would achieve almost nothing: the 78
  # dependencies they drag in would still each resolve to whatever was newest
  # the moment the init container ran. Twelve pinned lines, seventy-eight
  # floating ones. Turning it off is what actually freezes the install.
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  #
  # Regenerate the whole block from a controller that is known good:
  #
  #   curl -sk -u "admin:$JENKINS_TOKEN" \
  #     "$JENKINS_URL/pluginManager/api/json?depth=1&tree=plugins[shortName,version]" \
  #     | jq -r '.plugins[] | "    - \(.shortName):\(.version)"' | sort
  #
  # Then restart the controller and confirm it comes back Ready before
  # committing -- an unvalidated pin is worse than no pin. README section 10.9.
  installPlugins:
    # ---- chosen deliberately: every one backs a step we actually use -------
    - kubernetes:4547.v52f3080db_8cd               # dynamic pod agents
    - workflow-aggregator:608.v67378e9d3db_1       # declarative pipeline
    - git:5.10.1                                   # clone the repository
    - github:1.47.0                                # webhook trigger
    - github-branch-source:1983.vfa_27ed961853     # multibranch + PR discovery
    - configuration-as-code:2117.vc05a_0b_e6b_f4e  # JCasC itself
    - job-dsl:3732.v9a_c49a_61a_313                # required for the `jobs:` root element
    - pipeline-stage-view:2.41                     # stage view in the UI
    - junit:1424.vc64a_edde7777                    # publish test results
    - pipeline-utility-steps:3.810.va_7672d206740  # readJSON in the CI pipeline
    - timestamper:1.30                             # the timestamps() pipeline option
    - ws-cleanup:0.49                              # the cleanWs() step in both pipelines
    - prometheus:860.v532442b_44e9a_               # /prometheus endpoint (phase 5)
    # ---- resolved dependencies: GENERATED, do not hand-edit ---------------
    # Not choices. These are what the twelve above pull in, captured at the
    # exact versions a working controller had. They are listed so a rebuild
    # installs the same bytes, not because anyone picked them.
    #
    # `mailer` appears here and that is not a contradiction: it arrives as a
    # dependency, no SMTP is configured for it, and build notifications still
    # publish to SNS from the agent. `email-ext` is genuinely absent -- a test
    # asserts it stays that way.
    - antisamy-markup-formatter:173.v680e3a_b_69ff3
    - apache-httpcomponents-client-4-api:4.5.14-269.vfa_2321039a_83
    - asm-api:9.10.1-216.va_9256d3b_844b_
